name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fails the build on high/critical advisories; the full report is
      # printed first for visibility into moderates. Unpatchable advisories
      # are allowlisted by GHSA id in audit-ci.jsonc.
      - run: npm audit || true
      - run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
